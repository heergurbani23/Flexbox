<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            text-align: center;
            color: black;
          
        }
        .con{
            height: 600px;
            border: 1px solid black;
        }
        .header{
            height: 20%;
            background-color: rgb(147, 188, 186);
            border: 1px solid black;  
        }
        .center{
            height: 60%;
            background-color: rgb(149, 161, 247);
            display: flex;
            border: 1px solid black ;
        }
       .left{
        height: 100%;
        width: 30%;
        background-color: rgb(249, 201, 175);
        border: 1px solid black;
       }
       .right{
         height: 100%;
        width: 70%;
        background-color: #d9e5b1;
        border: 1px solid black;
       }
       .top{
         height: 50%;
        background-color: hsl(292, 79%, 87%);
        border: 1px solid black;
       }
       .bottom{
        height: 50%;
        background-color: hwb(140 67% 16%);
        border: 1px solid black;
        display: flex;
         }
         .r1{
        height: 100%;
        width: 50%;
        background-color: hsl(330, 58%, 79%);
        border: 1px solid black;
        }
        .r2{
        height: 100%;
        width: 50%;
        background-color: hwb(240 62% 10%);
        border: 1px solid black;
        }
        .footer{
        height:20%;
        background-color: lch(90.76% 22.55 137.73);
        border: 1px solid black;
        }        
    </style>
</head>
<body>
    <H1>FLEX BOX</H1>
    <div class="con">
      <div class="header">
        <h1></h1>
      </div>
      <div class="center">
        <div class="left">
        </div>
        <div class="right">
            <div class="top"></div>
            <div class="bottom">
                <div class="r1"></div>
                <div class="r2"></div>
            </div>
        </div>
      </div>
      <div class="footer"></div>
    </div>
    
    
</body>
</html>
